spring.application.name=biblioteca

# CONF ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always

# setup connessione database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:biblioteca_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# configurazioni per JPA
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

# configurazioni del framework (impostazione su redirect)
server.forward-headers-strategy=framework

# swagger
springdoc.api-docs.path=/api-docs-prod
springdoc.swagger-ui.path=/swagger-ui-prod.html